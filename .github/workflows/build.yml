name: Cache and Build

# ////// WORKFLOW RULES //////

on:
  # Reuse job logic in different pipelines
  workflow_call:

# ////// JOBS //////

jobs:

# ////// BUILD //////

  build:
    name: Build problem list and static files
    needs: test
    runs-on: ubuntu-latest
    env:
      REACT_APP_PROBLEM_SET: ${{secrets.REACT_APP_PROBLEM_SET}}
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync
      - run: git -c submodule.src/private-problems.update=none submodule update --init --recursive

      # Defines the cache for the npm modules
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/