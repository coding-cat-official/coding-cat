name: Deploy to Coding Cat


# ////// WORKFLOW RULES //////

on:
  # Runs action on pushes to staging
  push:
    branches: [staging, test-staging]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# ////// JOBS //////

jobs:

# ////// BUILD //////

  build:
    name: Build problem list and static files
    uses: ./.github/workflows/build.yml
    secrets: inherit

# ////// DEPLOY //////
  
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: /coding-cat

    # Run if merging into staging
    if: github.ref == 'refs/heads/test-staging'
    
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
    # boiler plate to tell where to upload pages
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the artifacts
          name: build
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  