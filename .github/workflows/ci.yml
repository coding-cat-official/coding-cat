name: Test & Lint the Coding Cat app

# ////// WORKFLOW RULES //////

on:
  # Start action to PR to main or staging
  pull_request:
    branches: [main, staging, test-staging, test-main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:  

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# ////// JOBS //////

jobs:

# ////// BUILD //////

  build:
    name: Build problem list and static files
    uses: ./.github/workflows/build.yml
    secrets: inherit

# ////// TEST //////

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test
