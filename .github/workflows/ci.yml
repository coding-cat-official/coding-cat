name: Test & Lint the Coding Cat app

# ////// WORKFLOW RULES //////

on:
  # Start action to PR to main or staging
  pull_request:
    branches: [main, staging]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:  

# ////// JOBS //////

jobs:

# ////// BUILD //////

  build:
    name: Build problem list and static files
    uses: ./.github/workflows/build.yml
    secrets: inherit

# ////// TEST //////

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up npm dependencies
        uses: ./.github/actions/npm-setup
      - run: npm run test
